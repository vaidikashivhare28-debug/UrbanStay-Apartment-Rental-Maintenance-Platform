<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Add Tenant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="navbar">
    <div><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('tenants') }}">Tenants</a></div>
    <div><a href="{{ url_for('logout') }}">Logout</a></div>
</div>
<div class="container">
    <h1>Add New Tenant</h1>
    <form method="POST" style="max-width:400px;">
        <label>Name</label><input type="text" name="name" required>
        <label>Email</label><input type="email" name="email" required>
        <label>Phone</label><input type="text" name="phone" required>
        <label>Password</label><input type="password" name="password" required>
        <button type="submit">Save</button>
    </form>
</div>
</body></html>
