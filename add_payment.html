<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Record Payment</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="navbar">
    <div><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('payments') }}">Payments</a></div>
    <div><a href="{{ url_for('logout') }}">Logout</a></div>
</div>
<div class="container">
    <h1>Record New Payment</h1>
    <form method="POST" style="max-width:400px;">
        <label>Lease</label>
        <select name="lease_id" required>
            {% for l in leases %}<option value="{{ l.lease_id }}">{{ l.tenant_name }} - {{ l.unit_number }}</option>{% endfor %}
        </select>
        <label>Payment Date</label><input type="date" name="payment_date" required>
        <label>Amount</label><input type="number" step="0.01" name="amount" required>
        <label>Status</label>
        <select name="status">
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Overdue">Overdue</option>
        </select>
        <button type="submit">Save</button>
    </form>
</div>
</body></html>
