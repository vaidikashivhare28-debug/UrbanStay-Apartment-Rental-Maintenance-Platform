<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanStay - Add Unit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('units') }}">Units</a>
            <a href="{{ url_for('tenants') }}">Tenants</a>
            <a href="{{ url_for('leases') }}">Leases</a>
            <a href="{{ url_for('payments') }}">Payments</a>
            <a href="{{ url_for('maintenance') }}">Maintenance</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('settings') }}">Settings</a>
        </div>
        <div>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>

    <div class="container">
        <h1>Add New Unit</h1>
        <form method="POST" style="max-width:400px;">
            <label>Building</label>
            <select name="building_id" required>
                {% for b in buildings %}
                <option value="{{ b.building_id }}">{{ b.name }}</option>
                {% endfor %}
            </select>

            <label>Unit Number</label>
            <input type="text" name="unit_number" required>

            <label>Bedrooms</label>
            <input type="number" name="bedrooms" min="0" required>

            <label>Monthly Rent</label>
            <input type="number" name="rent_amount" min="1" step="0.01" required>

            <button type="submit">Save</button>
        </form>
    </div>
</body>
</html>
